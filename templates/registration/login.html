{% extends "base.html" %}
{% block titulo %}Entrar | GestãoFácil{% endblock %}
{% block conteudo %}
<section class="painel login-cartao">
    <h1>Entrar</h1>
    <form class="formulario" method="post">
        {% csrf_token %}
        {{ form.as_div }}
        {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
        <div class="acoes"><button class="botao" type="submit">Entrar</button></div>
    </form>
</section>
{% endblock %}
