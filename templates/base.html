{% load static %}
<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block titulo %}GestãoFácil{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body>
<header class="topo">
    <div class="topo-conteudo">
        <a class="marca" href="{% url 'painel' %}">
            <span class="marca-simbolo" aria-hidden="true">G</span> GestãoFácil
        </a>
        {% if user.is_authenticated %}
        <nav aria-label="Navegação principal">
            <a href="{% url 'painel' %}">Painel</a>
            <a href="{% url 'clientes_lista' %}">Clientes</a>
            <a href="{% url 'pedidos_lista' %}">Pedidos</a>
        </nav>
        <form action="{% url 'logout' %}" method="post">
            {% csrf_token %}
            <button class="botao secundario sair" type="submit">Sair</button>
        </form>
        {% endif %}
    </div>
</header>
<main class="container">
    {% for mensagem in messages %}
        <p class="mensagem {{ mensagem.tags }}" role="status">{{ mensagem }}</p>
    {% endfor %}
    {% block conteudo %}{% endblock %}
</main>
</body>
</html>
