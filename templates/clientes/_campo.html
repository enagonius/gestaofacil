<div class="campo{% if campo.errors %} campo-invalido{% endif %}">
    {{ campo.label_tag }}

    {{ campo }}

    {% if campo.help_text %}
        <small class="helptext" id="{{ campo.auto_id }}_helptext">
            {{ campo.help_text }}
        </small>
    {% endif %}

    {% for erro in campo.errors %}
        <p class="erro-campo" role="alert">
            {{ erro }}
        </p>
    {% endfor %}
</div>
