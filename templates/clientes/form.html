{% extends "base.html" %}
{% block titulo %}Cadastro de cliente | GestãoFácil{% endblock %}
{% block conteudo %}
<a class="retorno" href="{% url 'clientes_lista' %}">Voltar para clientes</a>
<div class="titulo-pagina"><h1>{% if cliente %}Editar cliente{% else %}Novo cliente{% endif %}</h1></div>
<section class="painel formulario-painel">
    <form class="formulario" method="post">
        {% csrf_token %}
        {{ form.as_div }}
        <div class="acoes"><button class="botao" type="submit">Salvar cliente</button></div>
    </form>
</section>
{% endblock %}
